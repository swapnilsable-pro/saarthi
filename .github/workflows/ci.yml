name: ci

on:
  push:
  pull_request:

jobs:
  upstream-nse-trader-skill:
    name: upstream tests (nse-trader-skill, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests
        working-directory: vendor/nse-trader-skill
      - run: python tools/vendor.py --check
        working-directory: vendor/nse-trader-skill

  upstream-trading-skills-india:
    name: upstream tests (claude-trading-skills-india, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests
        working-directory: vendor/claude-trading-skills-india

  saarthi:
    name: saarthi (registry, runner, ledger, API, paper-only guard, offline smoke)
    runs-on: ubuntu-latest
    needs: [upstream-nse-trader-skill, upstream-trading-skills-india]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q

  web:
    name: web (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
